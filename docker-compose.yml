services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: grant_portal
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d grant_portal"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: versity/versitygw:v1.0.20
    command: ["--access", "local-access", "--secret", "local-secret-key", "--port", ":7070", "--region", "auto", "--health", "/health", "posix", "/data"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:57070:7070"
